<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geopima Agencies - Configurations</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Corrected Paths for Subfolder Deployment -->
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="agency-profile.css">
</head>
<body class="bg-light">

  <!-- Top Navigation Header -->
  <header class="top-header">
    <div class="header-left">
      <button class="menu-toggle-btn" id="toggle-sidebar" aria-label="Toggle Sidebar">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="wiserenter-logo">
        <span class="logo-w"><span class="w-yellow">G</span></span>
        <div class="logo-text">
          <span class="brand-name">Geopima</span>
          <span class="brand-sub">property management system</span>
        </div>
      </div>
    </div>
    
    <div class="header-right">
      <div class="user-dropdown">
        <span class="user-name">Samuel Muturi</span>
        <i class="fa-solid fa-caret-down"></i>
      </div>
    </div>
  </header>

  <!-- Main Page Container -->
  <main class="page-container">
    <div class="content-wrapper">
      
      <!-- Sub Navigation Tabs -->
      <nav class="sub-nav-tabs">
        <button type="button" class="sub-nav-link active" data-tab="agencyTab">agency_profile</button>
        <button type="button" class="sub-nav-link" data-tab="messengerTab">messenger_configs</button>
        <button type="button" class="sub-nav-link" data-tab="mailerTab">mailer_configs</button>
        <button type="button" class="sub-nav-link" data-tab="mpesaTab">mpesa_configs</button>
      </nav>

      <!-- TAB 1: AGENCY PROFILE -->
      <div id="agencyTab" class="config-tab-content">
        <div class="profile-card">
          <form id="agencyProfileForm" class="profile-form">
            
            <!-- Left Column: Dynamic Branding Preview Box -->
            <div class="logo-col">
              <div class="logo-preview-box">
                <div id="logoPreviewContainer" class="logo-preview-media" style="margin-bottom: 8px; display: flex; justify-content: center;">
                  <div class="roof-illustration" id="defaultRoofIllustration">
                    <i class="fa-solid fa-house-chimney"></i>
                    <i class="fa-solid fa-house-chimney active-roof"></i>
                    <i class="fa-solid fa-house-chimney"></i>
                  </div>
                </div>
                <h1 class="agency-title" id="previewCompanyName">GEOPIMA AGENCY</h1>
                <p class="agency-motto" id="previewMottoSlogan">Exceptional Property management</p>
              </div>
            </div>

            <!-- Right Column: Form Inputs Grid -->
            <div class="form-col">
              <div class="form-row row-3-cols">
                <div class="field-container">
                  <input type="text" id="companyName" class="custom-input" value="GEOPIMA AGENCY">
                  <label for="companyName" class="sub-label">Company Name</label>
                </div>
                <div class="field-container">
                  <input type="text" id="shortName" class="custom-input">
                  <label for="shortName" class="sub-label">Short Name</label>
                </div>
                <div class="field-container flex-grow">
                  <input type="text" id="mottoSlogan" class="custom-input" value="Exceptional Property management">
                  <label for="mottoSlogan" class="sub-label">Motto/Slogan</label>
                </div>
              </div>

              <div class="form-row row-3-cols">
                <div class="field-container">
                  <input type="text" id="contact" class="custom-input">
                  <label for="contact" class="sub-label">Contact</label>
                </div>
                <div class="field-container">
                  <input type="text" id="contact2" class="custom-input">
                  <label for="contact2" class="sub-label">Contact 2</label>
                </div>
                <div class="field-container flex-grow">
                  <input type="email" id="email" class="custom-input">
                  <label for="email" class="sub-label">Email</label>
                </div>
              </div>

              <div class="form-row row-2-cols">
                <div class="field-container flex-2">
                  <input type="text" id="physicalAddress" class="custom-input">
                  <label for="physicalAddress" class="sub-label">Physical Address</label>
                </div>
                <div class="field-container flex-1">
                  <input type="text" id="postalAddress" class="custom-input">
                  <label for="postalAddress" class="sub-label">Postal Address</label>
                </div>
              </div>

              <div class="form-row row-2-cols">
                <div class="field-container flex-1">
                  <input type="text" id="website" class="custom-input">
                  <label for="website" class="sub-label">Website</label>
                </div>
                <div class="field-container flex-1">
                  <select id="endMonthTransition" class="custom-input select-input">
                    <option value="auto">Automatically transition to new month</option>
                    <option value="manual">Manual transition</option>
                  </select>
                  <label for="endMonthTransition" class="sub-label">End Month Transition Type</label>
                </div>
              </div>

              <!-- Company Logo File Input -->
              <div class="form-row full-width">
                <div class="field-container full-width-field">
                  <div class="file-input-wrapper">
                    <input type="file" id="companyLogo" class="file-input" accept="image/*">
                  </div>
                  <label for="companyLogo" class="sub-label">Company Logo</label>
                </div>
              </div>

              <div class="form-actions-row">
                <button type="submit" class="btn-save-changes">
                  <i class="fa-solid fa-floppy-disk"></i> Save Changes
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- TAB 2: MESSENGER CONFIGS -->
      <div id="messengerTab" class="config-tab-content" style="display: none;">
        <div class="profile-card" style="padding: 30px 40px;">
          <h2 style="font-size: 1.15rem; font-weight: 700; color: #475569; margin-bottom: 24px;">SMS Configurations</h2>
          <form id="messengerForm" class="form-col" style="gap: 20px;">
            <div class="field-container">
              <input type="text" id="serviceProvider" class="custom-input" value="WISERENTER" required>
              <label for="serviceProvider" class="sub-label">Service Provider <span style="color: #dc2626;">required</span></label>
            </div>
            <div class="field-container">
              <input type="text" id="senderId" class="custom-input" required>
              <label for="senderId" class="sub-label">Sender ID <span style="color: #dc2626;">required</span></label>
            </div>
            <div class="field-container">
              <input type="password" id="partnerId" class="custom-input" placeholder="••••" required>
              <label for="partnerId" class="sub-label">Partner ID <span style="color: #dc2626;">required</span></label>
            </div>
            <div class="field-container">
              <input type="password" id="partnerKey" class="custom-input" placeholder="••••••••••••••••••••••••••••" required>
              <label for="partnerKey" class="sub-label">Partner Key <span style="color: #dc2626;">required</span></label>
            </div>
            <div class="field-container">
              <input type="text" id="agencyPhone" class="custom-input">
              <label for="agencyPhone" class="sub-label">Send payment notification to agency</label>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
              <input type="checkbox" id="notifyTenant" style="width: 16px; height: 16px; cursor: pointer;" checked>
              <label for="notifyTenant" style="font-size: 0.88rem; color: #374151; cursor: pointer;">Send Payment Notification to tenant</label>
            </div>
            <div class="form-actions-row" style="margin-top: 15px;">
              <button type="submit" class="btn-save-changes">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- TAB 3: MAILER CONFIGS -->
      <div id="mailerTab" class="config-tab-content" style="display: none;">
        <div class="profile-card" style="padding: 30px 40px;">
          <h2 style="font-size: 1.15rem; font-weight: 700; color: #475569; margin-bottom: 24px;">Email (Webmail) Configurations</h2>
          <form id="mailerForm" class="form-col" style="gap: 20px;">
            <div class="field-container">
              <input type="text" id="smtpHost" class="custom-input" placeholder="mail.domain.com" required>
              <label for="smtpHost" class="sub-label">SMTP Host e.g. mail.domain.com <span style="color: #dc2626;">required</span></label>
            </div>
            <div class="form-row row-2-cols">
              <div class="field-container">
                <input type="text" id="smtpPort" class="custom-input" placeholder="465, 587" required>
                <label for="smtpPort" class="sub-label">SMTP Port e.g. 465, 587 <span style="color: #dc2626;">required</span></label>
              </div>
              <div class="field-container">
                <select id="smtpEncryption" class="custom-input select-input" required>
                  <option value="tls">tls</option>
                  <option value="ssl">ssl</option>
                  <option value="none">none</option>
                </select>
                <label for="smtpEncryption" class="sub-label">SMTP Encryption <span style="color: #dc2626;">required</span></label>
              </div>
            </div>
            <div class="field-container">
              <input type="text" id="smtpUsername" class="custom-input" placeholder="api@domain.com" required>
              <label for="smtpUsername" class="sub-label">SMTP Username e.g. api@domain.com <span style="color: #dc2626;">required</span></label>
            </div>
            <div class="field-container">
              <input type="password" id="smtpPassword" class="custom-input" placeholder="••••••••" required>
              <label for="smtpPassword" class="sub-label">SMTP Password <span style="color: #dc2626;">required</span></label>
            </div>
            <div class="form-row row-2-cols">
              <div class="field-container">
                <input type="text" id="billingDisplayName" class="custom-input" required>
                <label for="billingDisplayName" class="sub-label">Billing Email Display Name <span style="color: #dc2626;">required</span></label>
              </div>
              <div class="field-container">
                <input type="email" id="billingEmail" class="custom-input" placeholder="billing@domain.com" required>
                <label for="billingEmail" class="sub-label">Billing Email e.g. billing@domain.com <span style="color: #dc2626;">required</span></label>
              </div>
            </div>
            <div class="form-row row-2-cols">
              <div class="field-container">
                <input type="text" id="infoDisplayName" class="custom-input" required>
                <label for="infoDisplayName" class="sub-label">Info Email Display Name <span style="color: #dc2626;">required</span></label>
              </div>
              <div class="field-container">
                <input type="email" id="infoEmail" class="custom-input" placeholder="info@domain.com" required>
                <label for="infoEmail" class="sub-label">Info Email e.g. info@domain.com <span style="color: #dc2626;">required</span></label>
              </div>
            </div>
            <div class="form-actions-row" style="margin-top: 15px;">
              <button type="submit" class="btn-save-changes">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- TAB 4: MPESA CONFIGS -->
      <div id="mpesaTab" class="config-tab-content" style="display: none;">
        <div class="profile-card" style="padding: 30px 40px;">
          <h2 style="font-size: 1.15rem; font-weight: 700; color: #475569; margin-bottom: 24px;">Mpesa Configurations</h2>
          <form id="mpesaForm" class="form-col" style="gap: 20px;">
            <div class="field-container">
              <input type="text" id="shortcode" class="custom-input" value="4107433" required>
              <label for="shortcode" class="sub-label">Mpesa ShortCode</label>
            </div>
            <div class="form-row row-2-cols">
              <div class="field-container">
                <input type="password" id="consumerKey" class="custom-input" placeholder="•••••••" required>
                <label for="consumerKey" class="sub-label">Consumer Key</label>
              </div>
              <div class="field-container">
                <input type="password" id="consumerSecret" class="custom-input" placeholder="•••••••" required>
                <label for="consumerSecret" class="sub-label">Consumer Secret</label>
              </div>
            </div>
            <div class="form-row row-2-cols">
              <div class="field-container">
                <input type="password" id="passKey" class="custom-input" placeholder="•••••••" required>
                <label for="passKey" class="sub-label">Pass Key</label>
              </div>
              <div class="field-container">
                <input type="text" id="initiatorName" class="custom-input" placeholder="•••••••" required>
                <label for="initiatorName" class="sub-label">Initiator Name</label>
              </div>
            </div>
            <div class="form-row row-2-cols">
              <div class="field-container">
                <input type="password" id="initiatorPassword" class="custom-input" placeholder="•••••••" required>
                <label for="initiatorPassword" class="sub-label">Initiator Password</label>
              </div>
              <div class="field-container">
                <input type="text" id="initiatorEncryption" class="custom-input" placeholder="•••••••" required>
                <label for="initiatorEncryption" class="sub-label">Initiator Encryption</label>
              </div>
            </div>
            <div class="form-actions-row" style="margin-top: 15px;">
              <button type="submit" class="btn-save-changes">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

  <!-- Corrected Script Paths for Subfolder Deployment -->
  <script src="../js/api.js"></script>
  <script src="../script.js"></script>
  <script src="agency-profile.js"></script>
</body>
</html>
